steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg DATABASE_URL=$$DATABASE_URL \
          -t gcr.io/$PROJECT_ID/conference-bms:$COMMIT_SHA \
          -t gcr.io/$PROJECT_ID/conference-bms:latest .
    secretEnv: ['DATABASE_URL']

  # 2. Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/conference-bms'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'conference-bms'
      - '--image'
      - 'gcr.io/$PROJECT_ID/conference-bms:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'conferra-bms@conferra-bms.iam.gserviceaccount.com' # Use your existing service account
      - '--set-secrets'
      - |
        DATABASE_URL=DATABASE_URL:latest,
        JWT_SECRET=JWT_SECRET:latest,
        INTERNAL_CRON_SECRET=INTERNAL_CRON_SECRET:latest,
        RESEND_API_KEY=RESEND_API_KEY:latest,
        GOOGLE_SERVICE_ACCOUNT_EMAIL=GOOGLE_SERVICE_ACCOUNT_EMAIL:latest,
        GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:latest,
        GOOGLE_CALENDAR_IMPERSONATE_EMAIL=GOOGLE_CALENDAR_IMPERSONATE_EMAIL:latest

# This pulls the DB secret ONLY during the build step for Prisma
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
    env: 'DATABASE_URL'

images:
  - 'gcr.io/$PROJECT_ID/conference-bms:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/conference-bms:latest'

options:
  logging: CLOUD_LOGGING_ONLY